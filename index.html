<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BPL CCTV Layout</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<script src="assets/bpl-store.js"></script>
<script src="assets/config.js"></script>
<script src="assets/bpl-cloud.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0e0e0e;color:#f2f0e8;font-family:"Archivo","IBM Plex Sans Thai",system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh}
main{width:min(440px,100%);background:#141414;border:2px solid #f2f0e8;box-shadow:0 16px 40px rgba(0,0,0,.65)}
.brand{display:flex;align-items:stretch;border-bottom:1px solid #2a2a2a}
.logo{width:76px;flex:none;background:#ffd000;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:14px 0}
.logo b{font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo span{font-size:9px;font-weight:800;letter-spacing:.12em;margin-top:3px}
.brand h1{margin:0;font-size:18px;font-weight:800;line-height:1.2}
.brand p{margin:2px 0 0;font-size:12px;color:#8a8a8a}
.brand>div:last-child{padding:12px 16px;display:flex;flex-direction:column;justify-content:center}
form{padding:20px 18px 18px;display:flex;flex-direction:column;gap:10px}
label{font-size:11px;font-weight:800;letter-spacing:.08em;color:#ffd000}
select+label{margin-top:6px}
input,select{height:46px;width:100%;padding:0 12px;font:inherit;font-size:16px;color:#f2f0e8;background:#1a1a1a;border:1px solid #444}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid #ffd000;outline-offset:2px}
#msg{margin:0;min-height:18px;font-size:13px;font-weight:600;color:#ff8a73}
button{height:46px;border:0;background:#ffd000;color:#111;font:inherit;font-size:15px;font-weight:800;cursor:pointer}
button:hover{background:#ffe04d}
button:disabled{opacity:.5;cursor:progress}
.hint{margin:0;padding:14px 18px;border-top:1px solid #2a2a2a;font-size:12px;line-height:1.7;color:#a6a6a6}
.hint b{color:#f2f0e8}
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="logo"><b>BPL</b><span>CCTV</span></div>
    <div><h1>CCTV Layout</h1><p>ผังกล้องวงจรปิด · เฉพาะผู้ได้รับอนุญาต</p></div>
  </div>
  <form id="form">
    <label for="uid">ไอดี</label>
    <select id="uid"><option value="">กำลังโหลด…</option></select>
    <label for="code">รหัสผ่าน</label>
    <input id="code" type="password" autocomplete="current-password" autofocus>
    <p id="msg" role="status"></p>
    <button id="go" type="submit">เข้าใช้งาน</button>
  </form>
  <p class="hint">เลือกไอดีแล้วใส่รหัสผ่าน<br>เครื่องนี้จะจำไว้ให้ จนกว่าผู้ดูแลจะเปลี่ยนรหัสผ่าน</p>
</main>
<script>
(function () {
  const c = BPL.cloud, page = role => location.replace(role === 'edit' ? 'edit/' : 'view/');
  if (c.hasToken() && c.cfg().role) { page(c.cfg().role); return; }
  const form = document.getElementById('form'), uid = document.getElementById('uid'), code = document.getElementById('code'), msg = document.getElementById('msg'), go = document.getElementById('go');
  // offer the IDs that have a password set, the floor staff's one first
  c.accessList().then(list => {
    uid.innerHTML = '';
    list.forEach(u => { const o = document.createElement('option'); o.value = u.slot; o.textContent = u.id; uid.appendChild(o); });
    if (!list.length) { const o = document.createElement('option'); o.value = ''; o.textContent = 'ยังไม่ได้ตั้งไอดี (ผู้ดูแลวาง token ในช่องรหัสผ่าน)'; uid.appendChild(o); }
  }, () => { uid.options[0].textContent = 'โหลดรายชื่อไอดีไม่ได้ ลองรีเฟรช'; });
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    if (!code.value) return;
    const fail = t => { c.setCfg({ token: '', slot: '', stamp: '' }); go.disabled = false; msg.style.color = '#ff8a73'; msg.textContent = t; };
    go.disabled = true; msg.style.color = '#ffd000'; msg.textContent = 'กำลังตรวจสอบ…';
    try {
      // the admin can paste a GitHub token as the password (first setup, or after regenerating a token)
      const pasted = /^(github_pat_|ghp_)/.test(code.value.trim());
      const hit = pasted ? { token: code.value.trim(), stamp: '' } : await c.login(uid.value, code.value);
      if (!hit) return fail('รหัสผ่านไม่ถูกต้อง');
      c.setCfg({ token: hit.token, role: '', slot: pasted ? '' : uid.value, stamp: hit.stamp });
      const role = await c.probe(); c.setCfg({ role }); page(role);
    } catch (err) { fail(err.status === 401 ? 'รหัสนี้ถูกยกเลิกแล้ว ติดต่อผู้ดูแล' : err.status ? 'เข้าใช้งานไม่ได้ (' + err.message + ')' : 'เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง'); }
  });
})();
</script>
</body>
</html>
